<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>

    <article class="card">

      <img class="card-image" src="./assets/images/illustration-article.svg" alt="Abstract illustration">

      <div class="card-content">

      <p class="tag">Learning</p>

      <p class="date">Published 21 Dec 2023</p>

      <h1 class="title"><a href="#">HTML & CSS foundations</a></h1>

      <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>

      </div>

      <div class="author">
        <img class="author-image" src="./assets/images/image-avatar.webp" alt="">
        <p class="author-name">Greg Hooper</p>
      </div>

    </article>

  </main>

  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://agata-simenc-portfolio.netlify.app/">Agi</a>.
  </footer>
</body>
</html>
